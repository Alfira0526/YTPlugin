<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 300px;
        margin: 0;
        padding: 14px 16px 18px;
        font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
        font-size: 13px;
        background: #fff;
        color: #1a2130;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1a2130; color: #e8ecf4; }
        .card { background: #232c3d !important; border-color: #333e54 !important; }
        input[type="file"] { color: #e8ecf4; }
      }
      h1 { font-size: 14px; margin: 0 0 2px; }
      .sub { font-size: 11px; color: #7f8aa3; margin: 0 0 12px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; }
      .row label { flex: 1; }
      input[type="range"] { flex: 1.3; }
      .val { width: 34px; text-align: right; font-variant-numeric: tabular-nums; color: #7f8aa3; }
      .card { background: #f4f6fb; border: 1px solid #e2e6ef; border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
      .card h2 { font-size: 12px; margin: 0 0 8px; }
      .status { font-size: 11px; color: #7f8aa3; margin-top: 8px; line-height: 1.5; }
      .switch { display: flex; align-items: center; gap: 8px; font-weight: 600; }
      button { font: inherit; }
      .hint { font-size: 11px; color: #7f8aa3; margin-top: 6px; }
      code { background: rgba(127,138,163,.18); padding: 1px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>YTPlugin 자막</h1>
    <p class="sub">유튜브 영상 위 한국어 자막 오버레이</p>

    <div class="row switch">
      <label for="enabled">자막 켜기</label>
      <input type="checkbox" id="enabled" checked />
    </div>

    <div class="row">
      <label for="fontScale">글자 크기</label>
      <input type="range" id="fontScale" min="0.6" max="2" step="0.1" value="1" />
      <span class="val" id="fontScaleVal">1.0</span>
    </div>

    <div class="row">
      <label for="verticalPosition">세로 위치</label>
      <input type="range" id="verticalPosition" min="50" max="98" step="1" value="88" />
      <span class="val" id="verticalPositionVal">88</span>
    </div>

    <div class="row">
      <label for="bgOpacity">배경 진하기</label>
      <input type="range" id="bgOpacity" min="0" max="1" step="0.05" value="0.55" />
      <span class="val" id="bgOpacityVal">0.55</span>
    </div>

    <div class="card">
      <h2>실시간 자막 (베타)</h2>
      <button id="realtimeBtn" style="width:100%;padding:9px;border-radius:8px;border:1px solid #3a5bd9;background:#3a5bd9;color:#fff;font-weight:600;cursor:pointer;">실시간 자막 시작</button>
      <div class="hint">탭 오디오를 캡처해 실시간으로 자막을 표시합니다((a) 방식). 단축키 <code>Ctrl/⌘+Shift+Y</code>로도 시작(앱 창 포함).</div>
      <input type="password" id="deeplKey" placeholder="DeepL API 키 (선택 입력)" autocomplete="off" style="width:100%;margin-top:8px;padding:7px 9px;border:1px solid #dde3ef;border-radius:8px;box-sizing:border-box;" />
      <div class="hint">키를 넣으면 <b>실제 번역(DeepL)</b>, 없으면 데모 목 번역이 표시됩니다. 키는 이 브라우저에만 저장됩니다.</div>
    </div>

    <div class="card">
      <h2>이 영상 자막(SRT) 불러오기</h2>
      <input type="file" id="srtFile" accept=".srt,.vtt,text/plain" />
      <div class="hint">사전 생성된 자막 파일을 현재 영상(<code id="vidLabel">-</code>)에 적용합니다.</div>
      <div class="status" id="status">상태 확인 중…</div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
